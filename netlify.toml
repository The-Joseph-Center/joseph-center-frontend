[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy program slug — preserve any external links to the old IFS URL
[[redirects]]
  from = "/programs/financial-services"
  to = "/programs/integrated-financial-services"
  status = 301
  force = true

# A memorable address for the Stripe donor portal, so the link in emails and
# the footer is ours rather than a 40-character Stripe URL nobody can read out
# over the phone. 302 rather than 301: the Stripe login URL can change, and a
# permanently cached redirect to a dead one would be unfixable for anyone who
# had already followed it.
#
# The browser does land on billing.stripe.com, which is the right outcome —
# people expect to see Stripe when money is involved, and a payment page on a
# domain that only looks like Stripe is the shape of a phishing site.
[[redirects]]
  from = "/portal"
  to = "https://billing.stripe.com/p/login/4gwdUFcVI6nF4cEbII"
  status = 302
  force = true

[[redirects]]
  from = "/donor-portal"
  to = "https://billing.stripe.com/p/login/4gwdUFcVI6nF4cEbII"
  status = 302
  force = true

# SPA catch-all — keep last so specific redirects above win
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."sync-coffee-chat"]
  # Saturday at 06:00 UTC. Cron format: minute hour dom month dow
  # (dow 6 = Saturday). Adjust hour if a different time-of-day is wanted.
  schedule = "0 6 * * 6"
