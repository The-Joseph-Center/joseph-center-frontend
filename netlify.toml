[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy program slug — preserve any external links to the old IFS URL
[[redirects]]
  from = "/programs/financial-services"
  to = "/programs/integrated-financial-services"
  status = 301
  force = true

# SPA catch-all — keep last so specific redirects above win
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."sync-coffee-chat"]
  # Saturday at 06:00 UTC. Cron format: minute hour dom month dow
  # (dow 6 = Saturday). Adjust hour if a different time-of-day is wanted.
  schedule = "0 6 * * 6"
